<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Хайдаров Айдар Рифович</title>
        <link rel="stylesheet" href="static/style/style.css">
    </head>
    <body>
        <header>
            <h1 class="container">Список задач</h1>
        </header>
        <div class="container">
            <div class="create-task-card">
                <h2>Новая задача</h2>
                <div class="input-group">
                    <label>
                        <input type="text" class="task-input" placeholder="Название задачи..." />
                    </label>
                    <button class="add-button">
                        Добавить
                    </button>
                </div>
            </div>
            <div class="create-task-card">
                <div class="backlog-columns">
                    <div class="column-header backlog">Бэклог</div>
                    <ul class="task-list">
                        <li class="task-item">Выучить JS</li>
                        <li class="task-item">Выучить React</li>
                        <li class="task-item">Сделать домашку</li>
                    </ul>
                </div>
                <div class="in-progress-column">
                    <div class="column-header in-progress">В процессе</div>
                    <ul class="task-list">
                        <li class="task-item">Выпить смузи</li>
                        <li class="task-item">Попить воды</li>
                    </ul>
                </div>
                <div class="ready-column">
                    <div class="column-header done">Готово</div>
                    <ul class="task-list">
                        <li class="task-item">Позвонить маме</li>
                        <li class="task-item">Погладить кота</li>
                    </ul>
                </div>
                <div class="trasher-column">
                    <div class="column-header trash">Корзина</div>
                    <ul class="task-list">
                        <li class="task-item">Сходить погулять</li>
                        <li class="task-item">Прочитать Войну и Мир</li>
                    </ul>
                    <button class="clear-button">
                        Очистить
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
